default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: no-markdown
        name: block staged markdown
        language: fail
        entry: Markdown stays local and gitignored; unstage it
        files: (?i)\.md$
        exclude: ^README\.md$
      - id: no-ai-attribution
        name: block AI attribution in commit message
        language: python
        entry: python scripts/check_commit_msg.py
        stages: [commit-msg]
