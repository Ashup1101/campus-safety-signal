[project]
name = "campus-safety-signal"
version = "0.1.0"
description = "Location-aware campus safety signal for IU Bloomington"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.112",
]

[project.scripts]
iu-crime-log = "campus_safety.iu_crime_log.cli:main"
bpd-cfs = "campus_safety.bpd_cfs.cli:main"
calibration = "campus_safety.calibration.cli:main"
lake = "campus_safety.lake.cli:main"
t3 = "campus_safety.t3.cli:main"

[dependency-groups]
dev = [
    { include-group = "ml" },
    { include-group = "transform" },
    "moto[s3]>=5.2.4",
    "mypy",
    "pip-audit",
    "pre-commit",
    "pytest",
    "ruff",
    "types-boto3[s3]>=1.43.112",
    "types-pyyaml>=6.0.12.20260906",
    "types-xlrd>=2.0.0.20260518",
]
ml = [
    "en-core-web-sm",
    "presidio-analyzer>=2.2.364",
]
transform = [
    "dbt-duckdb>=1.11.0",
    "duckdb>=1.5.6",
    "pypdf>=6.20.1",
    "pyyaml>=6.0.3",
    "xlrd>=2.0.2",
]

[build-system]
requires = ["uv_build>=0.11.0,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "campus_safety"

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

# Only resolve releases at least two weeks old, as with pinned GitHub Actions. Packages that
# pip-audit flags are exempt so a security fix never waits out the cooldown.
[tool.uv]
exclude-newer = "14 days"
exclude-newer-package = { certifi = "0 days", filelock = "0 days", pypdf = "0 days", setuptools = "0 days", virtualenv = "0 days" }

[tool.ruff]
line-length = 100
target-version = "py312"
# Generated by scripts/build_t3_notebook.py; its sources are linted where they live.
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
files = ["src", "tests", "scripts"]
mypy_path = "src:scripts:tests"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
addopts = "-ra --strict-markers"
