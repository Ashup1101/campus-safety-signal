name: t2-train

# Trains T2, the news relevance model, on public news feed items (titles and short summaries,
# never article bodies). Runs only when dispatched by hand on main (never on the laptop, never on
# a schedule). Polite fetching (honest User-Agent, robots checked). Uploads only scorecard.json
# and model.json (JSON weights, no pickles). Logs carry counts and scores only. No secrets.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: t2-train
  cancel-in-progress: false

jobs:
  train:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --locked --group train
      - name: Pull the public crime log and news feeds into this runner's lake
        run: |
          LAKE_URI="file://$RUNNER_TEMP/lake" uv run iu-crime-log run
          LAKE_URI="file://$RUNNER_TEMP/lake" uv run collect --only news_bloomingtonian,news_b_square_bulletin,news_ids,news_ipm
      - name: Transform in the runner
        run: LAKE_URI="file://$RUNNER_TEMP/lake" uv run lake --work-dir "$RUNNER_TEMP/warehouse" transform
      - name: Fit, score, switch
        run: uv run t2 train --warehouse "$RUNNER_TEMP/warehouse/warehouse.duckdb" --out "$RUNNER_TEMP/t2/out" --run-id "gh-$GITHUB_RUN_ID"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: t2-${{ github.run_id }}
          path: ${{ runner.temp }}/t2/out/
          retention-days: 14
          if-no-files-found: error
