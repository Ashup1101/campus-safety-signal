name: t1-train

# Trains T1, the tonight forecaster, on the city's public calls for service. Runs only when
# dispatched by hand on main (never on the laptop, never on a schedule). The runner pulls the
# public BPD calls into its own file:// lake (polite fetch: honest User-Agent, robots checked),
# builds the zone x night counts table, fits the models, applies the honesty switch and uploads
# only scorecard.json and forecast.parquet: counts, levels and plain reasons, never records.
# Logs carry counts and scores only. No secrets, no cloud credentials.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: t1-train
  cancel-in-progress: false

jobs:
  train:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --locked --group train
      - name: Pull the public BPD calls into this runner's lake
        run: LAKE_URI="file://$RUNNER_TEMP/lake" uv run bpd-cfs pull
      - name: Transform in the runner
        run: LAKE_URI="file://$RUNNER_TEMP/lake" uv run lake --work-dir "$RUNNER_TEMP/warehouse" transform
      - name: Counts table
        run: uv run t1 table --warehouse "$RUNNER_TEMP/warehouse/warehouse.duckdb" --out "$RUNNER_TEMP/t1/train.parquet"
      - name: Fit, switch, forecast
        run: uv run t1 train --table "$RUNNER_TEMP/t1/train.parquet" --out "$RUNNER_TEMP/t1/out" --run-id "gh-$GITHUB_RUN_ID"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: t1-${{ github.run_id }}
          path: ${{ runner.temp }}/t1/out/
          retention-days: 14
          if-no-files-found: error
