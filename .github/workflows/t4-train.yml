name: t4-train

# Trains T4, the prompt-injection screen, on the made-up red-team corpus and harmless texts in
# configs/redteam (nothing is fetched). Runs only when dispatched by hand on main (never on the
# laptop, never on a schedule). Uploads only scorecard.json and model.json (JSON weights, no
# pickles). Logs carry counts and scores only. No secrets.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: t4-train
  cancel-in-progress: false

jobs:
  train:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --locked --group train
      - name: Fit, score, switch
        run: uv run t4 train --out "$RUNNER_TEMP/t4/out" --run-id "gh-$GITHUB_RUN_ID"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: t4-${{ github.run_id }}
          path: ${{ runner.temp }}/t4/out/
          retention-days: 14
          if-no-files-found: error
