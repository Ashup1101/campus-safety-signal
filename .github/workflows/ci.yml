name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest
      - name: pip-audit
        run: make audit

  infra:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: terraform fmt -check + validate (pinned binary, no credentials)
        run: make infra-check

  secrets:
    runs-on: ubuntu-24.04
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (pinned checksum)
        working-directory: ${{ runner.temp }}
        run: |
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum --check
          tar -xzf "$tarball" gitleaks
      - name: Scan full history
        run: '"$RUNNER_TEMP/gitleaks" git --redact --verbose .'

  policy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: No tracked markdown except the root README
        run: |
          tracked="$(git ls-files ':(icase)*.md' | grep -vx 'README.md' || true)"
          if [ -n "$tracked" ]; then
            echo "::error::Markdown must stay local (only the root README.md is tracked):"
            echo "$tracked"
            exit 1
          fi
      # A PR is judged by the checker from its base, so it can't weaken its own gate.
      - name: Select checker
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$PR_BASE" ]; then
            git show "$PR_BASE:scripts/check_commit_msg.py" > "$RUNNER_TEMP/check.py"
          else
            cp scripts/check_commit_msg.py "$RUNNER_TEMP/check.py"
          fi
      - name: No AI attribution in commits
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$PR_BASE" ]; then
            range="$PR_BASE..$PR_HEAD"
          elif [ -z "$PUSH_BEFORE" ] || [ "$PUSH_BEFORE" = 0000000000000000000000000000000000000000 ]; then
            range="$GITHUB_SHA"
          else
            range="$PUSH_BEFORE..$GITHUB_SHA"
          fi
          status=0
          for sha in $(git rev-list "$range"); do
            git log -1 --format=%B "$sha" > "$RUNNER_TEMP/msg"
            if ! python3 "$RUNNER_TEMP/check.py" --raw "$RUNNER_TEMP/msg"; then
              echo "::error::commit $sha carries AI attribution"
              status=1
            fi
          done
          exit "$status"
      - name: No AI attribution in PR title/body
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s\n%s\n' "$PR_TITLE" "$PR_BODY" > "$RUNNER_TEMP/pr.txt"
          python3 "$RUNNER_TEMP/check.py" --raw "$RUNNER_TEMP/pr.txt"
