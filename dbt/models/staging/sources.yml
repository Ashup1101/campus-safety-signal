version: 2

sources:
  - name: lake_staging
    description: Per-snapshot Parquet written by campus_safety.lake.transform.
    meta:
      external_location: "read_parquet('{{ env_var('LAKE_STAGING_DIR') }}/{name}/*.parquet')"
    tables:
      - name: iu_crime_log_observations
      - name: iu_crime_log_runs
      - name: bpd_cfs_observations
      - name: bpd_cfs_metadata
      - name: calibration_clery_rows
      - name: calibration_bpd_metric_rows
      - name: news_items
      - name: news_extractions
      - name: news_clusters
      - name: news_cluster_items
      - name: synthetic_incidents
      - name: synthetic_anomalies
      - name: gap_register
