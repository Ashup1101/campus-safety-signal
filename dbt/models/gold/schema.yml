version: 2

models:
  - name: iu_crime_log_coverage
    description: Covered reporting-date ranges and gaps in the crime log history.
    columns:
      - name: kind
        data_tests:
          - accepted_values:
              arguments:
                values: [covered, gap]
      - name: days
        data_tests: [not_null]

  - name: bpd_cfs_audit
    description: One-row audit of the newest BPD calls-for-service pull.
  - name: bpd_cfs_missing_days
    columns:
      - name: day
        data_tests: [unique]
  - name: news_audit
    description: One-row audit of the news pipeline (duplicate and confirmation rates).
  - name: gap_report
    description: Per registered gap, real coverage vs synthetic patching vs Clery totals.
    columns:
      - name: gap_id
        data_tests: [unique, not_null]
  - name: incidents_real
    description: Conformed incidents without synthetic rows (the default public view).
    columns:
      - name: source
        data_tests:
          - accepted_values:
              arguments:
                values: [official, news]
