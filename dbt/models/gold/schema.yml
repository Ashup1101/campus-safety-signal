version: 2

models:
  - name: iu_crime_log_coverage
    description: Covered reporting-date ranges and gaps in the crime log history.
    columns:
      - name: kind
        data_tests:
          - accepted_values:
              arguments:
                values: [covered, gap]
      - name: days
        data_tests: [not_null]

  - name: bpd_cfs_audit
    description: One-row audit of the newest BPD calls-for-service pull.
  - name: bpd_cfs_missing_days
    columns:
      - name: day
        data_tests: [unique]
  - name: news_audit
    description: One-row audit of the news pipeline (duplicate and confirmation rates).
  - name: gap_report
    description: Per registered gap, real coverage vs synthetic patching vs Clery totals.
    columns:
      - name: gap_id
        data_tests: [unique, not_null]
  - name: incidents_real
    description: Conformed incidents without synthetic rows (the default public view).
    columns:
      - name: source
        data_tests:
          - accepted_values:
              arguments:
                values: [official, news]
  - name: incident_points
    description: Placed real incidents for maps; never sensitive offenses, never location text.
    columns:
      - name: incident_id
        data_tests: [unique, not_null]
      - name: precision
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [segment, address, block]
      - name: lat
        data_tests: [not_null]
      - name: lon
        data_tests: [not_null]
  - name: tonight
    description: Expected late-night level per police zone for the next nights (T1 or the rule).
    columns:
      - name: zonecode
        data_tests: [not_null]
      - name: night
        data_tests: [not_null]
      - name: level
        data_tests:
          - accepted_values:
              arguments:
                values: [quiet, elevated, high]
      - name: method
        data_tests:
          - accepted_values:
              arguments:
                values: [model, rule]
  - name: archive_coverage
    description: Wayback captures of the IU crime log per year - listed, parsed, failed, not fetched.
    columns:
      - name: year
        data_tests: [unique, not_null]
      - name: listed
        data_tests: [not_null]
  - name: console_cross_check
    description: IU log entries vs BPD calls per month, zone and shared category (calls are not crimes).
    columns:
      - name: month
        data_tests: [not_null]
      - name: zonecode
        data_tests: [not_null]
      - name: category
        data_tests:
          - accepted_values:
              arguments:
                values: [weapons, assault, burglary, theft, vandalism, alcohol, drugs, harassment, disturbance, trespass]
      - name: iu_count
        data_tests: [not_null]
      - name: bpd_count
        data_tests: [not_null]
  - name: bpd_zone_calls
    description: BPD calls per police reporting zone with the zone's centroid (no finer location exists).
    columns:
      - name: zonecode
        data_tests: [unique, not_null]
